# Local database environment for the MIT 8103 portfolio
# Start:  docker compose up -d
# Stop:   docker compose down          (data is kept in volumes)
services:
  postgres:
    image: postgres:16
    container_name: kashlink-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kashlink
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./:/portfolio            # lets psql inside the container read the .sql files

  mongo:
    image: mongo:7
    container_name: kashlink-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

volumes:
  pgdata:
  mongodata:
